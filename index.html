<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
      iframe {
          border: none;
          margin: 0;
          padding: 0;
          display: block;
          width: 100vw;
          height: 100vh;
      }
      html, body {
          margin: 0; 
          padding: 0; 
          width: 100%; 
          height: 100%;
      }
  </style>
</head>
<body>
  <iframe
    src="https://www.youtube.com/embed/" 
    id="yt-player"
    title="YouTube video player"
    frameBorder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <script>
    // 1. Grab the "?v=" parameter from the URL
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');

    // 2. If a video ID exists, attach it to the embed URL
    if (videoId) {
      const player = document.getElementById('yt-player');
      player.src = `https://youtube.com/embed/${videoId}`;
    } else {
      document.body.innerHTML = '<p style="color: white; background: black; margin: 0; padding: 20px; font-family: sans-serif;">No video ID provided. Add ?v=VIDEO_ID to the URL.</p>';
    }
  </script>
</body>
</html>
